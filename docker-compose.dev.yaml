services:
  frontend:
    build:
      context: ./../frontend
      dockerfile: Dockerfile.dev
    container_name: compass-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./../frontend:/frontend
      - /frontend/node_modules

  db:
    image: mysql:latest
    container_name: compass-db-dev
    volumes:
      - compass-data:/var/lin/mysql
    ports:
      - 3307:3307
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=compassDB
    networks:
      - compassNetwork

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "db"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./../backend
      dockerfile: Dockerfile.dev
    environment:
      DJANGO_ENV: "${DJANGO_ENV}"
    container_name: compass-backend-dev
    command: >
      bash -c "python manage.py makemigrations &&
              python manage.py migrate && 
              python manage.py create_default_superuser &&
              python manage.py runserver 0.0.0.0:8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./../backend:/backend
      - /app/.venv
    networks:
      - compassNetwork
volumes:
  compass-data:
networks:
  compassNetwork:
    driver: bridge
